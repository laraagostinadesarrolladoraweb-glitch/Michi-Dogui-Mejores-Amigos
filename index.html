<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Calma - Tablero de Micro-Pausas</title>
    <!-- Tailwind CSS para un diseño limpio y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8F6F0;
            color: #4A453F;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(184, 169, 150, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-8">

    <header class="max-w-2xl mx-auto w-full text-center py-6">
        <span class="inline-block bg-[#EFECE6] text-[#8C7A6B] text-xs font-semibold px-3 py-1 rounded-full mb-3 tracking-wider uppercase">Pausa Activa</span>
        <h1 class="text-3xl sm:text-4xl font-semibold text-[#38332E] tracking-tight mb-2">Espacio Calma</h1>
        <p class="text-sm sm:text-base text-[#7A7067] max-w-md mx-auto">Un refugio visual para desconectar, cuidar de ti y regalarte micro-pausas sin prisa ni exigencias.</p>
    </header>

    <main class="max-w-2xl mx-auto w-full flex-1 flex flex-col gap-6 my-2">
        
        <!-- Botón de sugerencia al azar y contador -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-[#EFECE6]/60 p-4 rounded-2xl border border-[#E5E0D5]">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[#DCD4C6] flex items-center justify-center text-[#5A5046] font-medium text-sm" id="completedCount">0/6</div>
                <div>
                    <h2 class="text-sm font-semibold text-[#38332E]">Tus pausas de hoy</h2>
                    <p class="text-xs text-[#7A7067]">Selecciona las que desees completar a tu ritmo.</p>
                </div>
            </div>
            <button onclick="suggestRandomPause()" class="w-full sm:w-auto bg-[#4A423B] hover:bg-[#38332E] text-[#F8F6F0] text-xs font-medium px-4 py-2.5 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2">
                <span>✨ Sugerir pausa al azar</span>
            </button>
        </div>

        <!-- Tarjetas de micro-pausas (Grid) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="cardsGrid">
            <!-- Las tarjetas se generan dinámicamente mediante JavaScript -->
        </div>

    </main>

    <footer class="max-w-2xl mx-auto w-full text-center py-6 border-t border-[#EFECE6] mt-8 text-xs text-[#9E9387]">
        <p>Hecho para acompañarte en tu día. Sin registros ni presiones.</p>
    </footer>

    <script>
        // Definición de las micro-pausas
        const pausasData = [
            {
                id: 1,
                title: "Estirar hombros y cuello",
                category: "Cuerpo",
                icon: "🌿",
                duration: "2 min",
                description: "Suelta los brazos a los costados. Rota los hombros hacia atrás lentamente 5 veces. Inclina con suavidad la oreja hacia el hombro derecho y luego al izquierdo sin forzar.",
                completed: false
            },
            {
                id: 2,
                title: "Atención al vaso de agua",
                category: "Sensorial",
                icon: "💧",
                duration: "1 min",
                description: "Sirve un vaso de agua fresca. Bebe pequeños sorbos prestando total atención a la temperatura, la textura y el recorrido del agua al calmar tu sed.",
                completed: false
            },
            {
                id: 3,
                title: "Mirar por la ventana",
                category: "Desconexión",
                icon: "🪟",
                duration: "2 min",
                description: "Aleja la vista de cualquier pantalla. Busca un punto lejano por la ventana, observa el cielo, las formas o los colores de afuera sin juzgar, solo contemplando.",
                completed: false
            },
            {
                id: 4,
                title: "Poner una canción favorita",
                category: "Bienestar",
                icon: "🎵",
                duration: "3 min",
                description: "Elige una canción que te traiga paz o alegría. Cierra los ojos o recuéstate mientras suena, escuchando cada instrumento o detalle melódico.",
                completed: false
            },
            {
                id: 5,
                title: "Respiración consciente",
                category: "Calma",
                icon: "🌬️",
                duration: "2 min",
                description: "Inhala profundamente por la nariz contando hasta 4, sostén el aire suavemente por 2 segundos y exhala despacio por la boca contando hasta 6. Repítelo 4 veces.",
                completed: false
            },
            {
                id: 6,
                title: "Pausa en silencio absoluto",
                category: "Mente",
                icon: "🕯️",
                duration: "2 min",
                description: "Silencia notificaciones, apaga música o sonidos externos si es posible. Quédate en absoluta quietud, permitiendo que tus pensamientos fluyan sin aferrarte a ninguno.",
                completed: false
            }
        ];

        let pausas = JSON.parse(localStorage.getItem('espacio_calma_pausas')) || pausasData;

        function saveState() {
            localStorage.setItem('espacio_calma_pausas', JSON.stringify(pausas));
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            let completedCount = 0;

            pausas.forEach((item, index) => {
                if (item.completed) completedCount++;

                const card = document.createElement('div');
                card.className = `card-hover bg-white p-5 rounded-2xl border ${item.completed ? 'border-[#DCD4C6] bg-[#FAF8F5]' : 'border-[#EAE3D9]'} flex flex-col justify-between gap-4 cursor-pointer relative overflow-hidden`;
                card.onclick = () => toggleDetails(item.id);

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl p-2 bg-[#F8F6F0] rounded-xl">${item.icon}</span>
                            <div>
                                <span class="text-[10px] font-semibold text-[#8C7A6B] uppercase tracking-wider">${item.category} • ${item.duration}</span>
                                <h3 class="text-base font-medium text-[#38332E] ${item.completed ? 'line-through text-[#9E9387]' : ''}">${item.title}</h3>
                            </div>
                        </div>
                        <button onclick="event.stopPropagation(); toggleComplete(${item.id})" class="w-6 h-6 rounded-full border-2 ${item.completed ? 'bg-[#8C7A6B] border-[#8C7A6B] text-white' : 'border-[#DCD4C6] hover:border-[#8C7A6B]'} flex items-center justify-center transition-all text-xs">
                            ${item.completed ? '✓' : ''}
                        </button>
                    </div>
                    <div class="text-xs text-[#7A7067] leading-relaxed border-t border-[#F4F1EA] pt-3">
                        <p class="font-normal">${item.description}</p>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('completedCount').textContent = `${completedCount}/${pausas.length}`;
        }

        function toggleComplete(id) {
            pausas = pausas.map(p => p.id === id ? { ...p, completed: !p.completed } : p);
            saveState();
            renderCards();
        }

        function toggleDetails(id) {
            // Acción táctil adicional al hacer clic en la tarjeta (puede usarse para destacar)
        }

        function suggestRandomPause() {
            const incomplete = pausas.filter(p => !p.completed);
            if (incomplete.length === 0) {
                alertCustom("¡Has completado todas las micro-pausas de hoy! Tómate un momento para celebrarlo.");
                return;
            }
            const randomIndex = Math.floor(Math.random() * incomplete.length);
            const chosen = incomplete[randomIndex];
            
            // Destacar o mostrar modal sutil o simplemente hacer scroll hacia la tarjeta
            const cards = document.getElementById('cardsGrid').children;
            const targetIndex = pausas.findIndex(p => p.id === chosen.id);
            if (cards[targetIndex]) {
                cards[targetIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                cards[targetIndex].style.transform = 'scale(1.02)';
                setTimeout(() => {
                    cards[targetIndex].style.transform = 'none';
                }, 600);
            }
        }

        function alertCustom(msg) {
            // Modal simple y limpio en lugar de alert nativo
            const div = document.createElement('div');
            div.className = 'fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center p-4 z-50';
            div.innerHTML = `
                <div class="bg-white p-6 rounded-2xl max-w-sm w-full text-center shadow-lg border border-[#EAE3D9]">
                    <p class="text-sm text-[#4A453F] mb-4">${msg}</p>
                    <button onclick="this.parentElement.parentElement.remove()" class="bg-[#4A423B] text-[#F8F6F0] text-xs px-4 py-2 rounded-xl font-medium">Entendido</button>
                </div>
            `;
            document.body.appendChild(div);
        }

        // Inicializar
        renderCards();
    </script>
</body>
</html>
