<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espacio Calma - Escritura y Liberación</title>
    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFFFF;
            --primary: #8C7B70;
            --primary-hover: #6E5F55;
            --text-main: #3C3633;
            --text-muted: #827872;
            --border-color: #E6E1DA;
            --accent-glow: rgba(140, 123, 112, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Área de escritura */
        .writing-area {
            position: relative;
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background-color: #FAFAF8;
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background-color: #FFFFFF;
        }

        /* Animación de disolución suave */
        .dissolving {
            animation: fadeOutParticles 1.2s forwards ease-in-out;
        }

        @keyframes fadeOutParticles {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.01) translateY(-4px);
                filter: blur(2px);
            }
            100% {
                opacity: 0;
                transform: scale(0.98) translateY(-10px);
                filter: blur(6px);
            }
        }

        /* Botón de acción */
        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Mensaje de calma posterior */
        .calm-message {
            display: none;
            text-align: center;
            padding: 30px 20px;
            animation: fadeIn 0.6s ease;
        }

        .calm-message h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .calm-message p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-note {
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="header">
            <h1>🌿 Espacio de Descarga</h1>
            <p>Escribe lo que necesites soltar. Nadie más lo leerá.</p>
        </div>

        <div class="writing-area" id="writingArea">
            <textarea id="userText" placeholder="Escribe aquí tus pensamientos, pendientes o aquello que sientas pesado hoy..."></textarea>
        </div>

        <button class="action-btn" id="releaseBtn" onclick="releaseText()">
            ✨ Soltar y dejar ir
        </button>

        <!-- Mensaje que aparece al liberar -->
        <div class="calm-message" id="calmMessage">
            <h2>Listo. Ya lo has soltado.</h2>
            <p>Tus palabras se han esfumado suavemente. Tómate una respiración profunda, relaja los hombros y continúa con tu día más liviana.</p>
            <button class="action-btn" onclick="resetSpace()">Volver a escribir</button>
        </div>

        <div class="footer-note" id="footerNote">
            Tus datos se quedan solo en tu pantalla y se borran al vaciarlos.
        </div>
    </div>

    <script>
        function releaseText() {
            const textarea = document.getElementById('userText');
            if (textarea.value.trim() === "") {
                textarea.style.borderColor = "#D9822B";
                setTimeout(() => {
                    textarea.style.borderColor = "var(--border-color)";
                }, 800);
                return;
            }

            // Aplicar animación de disolución al cuadro de texto
            textarea.classList.add('dissolving');
            document.getElementById('releaseBtn').style.display = 'none';
            document.getElementById('footerNote').style.display = 'none';

            // Tras la animación, mostrar mensaje de paz
            setTimeout(() => {
                textarea.style.display = 'none';
                textarea.classList.remove('dissolving');
                document.getElementById('calmMessage').style.display = 'block';
            }, 1000);
        }

        function resetSpace() {
            const textarea = document.getElementById('userText');
            textarea.value = "";
            textarea.style.display = 'block';
            document.getElementById('calmMessage').style.display = 'none';
            document.getElementById('releaseBtn').style.display = 'flex';
            document.getElementById('footerNote').style.display = 'block';
        }
    </script>
</body>
</html>
