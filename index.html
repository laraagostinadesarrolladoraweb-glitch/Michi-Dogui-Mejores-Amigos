<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Guazú - Mi Mascota Virtual</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #fffbeb 0%, #fef3c7 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px max(20px, env(safe-area-inset-bottom));
      position: relative;
    }

    .bg-particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      animation: floatBg 8s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatBg {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-30px) scale(1.1); opacity: 0.9; }
    }

    .top-panel {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    .nombre-mascota {
      color: #b45309;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .barras-container {
      width: 100%;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .barra-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .barra-label {
      font-size: 11px;
      font-weight: 800;
      color: #78350f;
      display: flex;
      justify-content: space-between;
    }

    .progreso-track {
      background: #fde68a;
      height: 10px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progreso-fill {
      height: 100%;
      width: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    #fill-hambre { background: linear-gradient(90deg, #34d399, #10b981); }
    #fill-felicidad { background: linear-gradient(90deg, #f59e0b, #d97706); }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .speech-bubble {
      background: #ffffff;
      color: #78350f;
      padding: 10px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 6px 16px rgba(180, 83, 9, 0.1);
      margin-bottom: 14px;
      position: relative;
      border: 2px solid #f59e0b;
      max-width: 95%;
      text-align: center;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    .guazu-wrapper {
      width: 250px;
      height: 200px;
      cursor: pointer;
      position: relative;
      animation: floatDynamic 4s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes floatDynamic {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    .guazu-wrapper.happy-bounce { animation: dynamicBounce 0.6s ease; }
    .guazu-wrapper.eat-wiggle { animation: dynamicChew 0.7s ease; }
    .guazu-wrapper.catch-ball { animation: dynamicJump 0.8s ease; }

    @keyframes dynamicBounce {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      30% { transform: translateY(-25px) scale(1.05, 0.95) rotate(-3deg); }
      60% { transform: translateY(-10px) scale(0.98, 1.02) rotate(2deg); }
    }

    @keyframes dynamicChew {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.06, 0.94) rotate(3deg); }
      50% { transform: scale(0.94, 1.06) rotate(-3deg); }
      75% { transform: scale(1.03, 0.97) rotate(1deg); }
    }

    @keyframes dynamicJump {
      0% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-35px) rotate(-6deg) scale(1.05); }
      70% { transform: translateY(-10px) rotate(3deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    .animated-item {
      position: absolute;
      font-size: 32px;
      pointer-events: none;
      z-index: 15;
    }

    .anim-fish { animation: dropFood 0.6s forwards; }
    @keyframes dropFood {
      0% { transform: translateY(-90px) scale(1.3); opacity: 1; }
      100% { transform: translateY(20px) scale(0.4); opacity: 0; }
    }

    .anim-ball { animation: throwBall 0.8s forwards; }
    @keyframes throwBall {
      0% { transform: translate(-120px, 50px) scale(1); }
      50% { transform: translate(-30px, -40px) scale(1.3); }
      100% { transform: translate(10px, 20px) scale(0.2); opacity: 0; }
    }

    .shadow {
      width: 160px;
      height: 14px;
      background: rgba(180, 83, 9, 0.18);
      border-radius: 50%;
      margin-top: 8px;
      transition: width 0.3s ease;
    }

    .guazu-wrapper.happy-bounce + .shadow { width: 130px; }

    .controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      gap: 12px;
      background: #ffffff;
      padding: 10px;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(180, 83, 9, 0.15);
      border: 2px solid #f59e0b;
      z-index: 20;
    }

    .btn {
      flex: 1;
      background: #fff3c4;
      color: #78350f;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.95);
      background: #fde68a;
    }

    .btn-icon { font-size: 20px; }

    .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.2s forwards ease-out;
      z-index: 30;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
    }
  </style>
</head>
<body>

  <div class="bg-particle" style="width: 70px; height: 70px; top: 10%; left: 5%;"></div>
  <div class="bg-particle" style="width: 100px; height: 100px; top: 50%; right: 5%;"></div>

  <div class="top-panel">
    <div class="nombre-mascota">Guazú</div>

    <div class="barras-container">
      <div class="barra-item">
        <div class="barra-label"><span>Hambre</span><span id="txt-hambre">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-hambre"></div></div>
      </div>
      <div class="barra-item">
        <div class="barra-label"><span>Felicidad</span><span id="txt-felicidad">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-felicidad"></div></div>
      </div>
    </div>
  </div>

  <div class="stage" id="stage-area">
    <div class="speech-bubble" id="bocadillo">¡Aowu! Tócame para darme mimos o aprender sobre el monte 🐾</div>
    
    <div class="guazu-wrapper" id="guazu-box" onclick="acariciar(event)">
      <svg id="guazu-svg" viewBox="0 0 140 110" width="100%" height="100%">
        <!-- Cola estilizada con punta blanca -->
        <path d="M 95 60 Q 125 52 132 38 Q 120 64 95 68 Z" fill="#d97706" stroke="#934710" stroke-width="1.2"/>
        <path d="M 118 43 Q 128 40 132 38 Q 124 50 118 43 Z" fill="#ffffff"/>

        <!-- Patas traseras largas y oscuras -->
        <path d="M 85 62 L 78 96 L 85 104 L 93 104 L 90 65 Z" fill="#1f110b"/>
        <path d="M 76 58 L 66 92 L 73 101 L 80 101 L 79 62 Z" fill="#c86d25" stroke="#934710" stroke-width="1.2"/>

        <!-- Cuerpo esbelto y arqueado -->
        <ellipse cx="68" cy="58" rx="32" ry="18" fill="#d97706" stroke="#934710" stroke-width="1.5"/>

        <!-- Melena negra erizada sobre el lomo -->
        <path d="M 42 38 Q 58 30 85 46 Q 66 40 42 38 Z" fill="#1f110b"/>
        <line x1="47" y1="36" x2="45" y2="29" stroke="#1f110b" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="56" y1="34" x2="56" y2="26" stroke="#1f110b" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="65" y1="35" x2="68" y2="27" stroke="#1f110b" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="74" y1="39" x2="80" y2="31" stroke="#1f110b" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Patas delanteras largas y oscuras ("medias") -->
        <path d="M 48 62 L 39 94 L 46 103 L 53 103 L 52 66 Z" fill="#1f110b"/>
        <path d="M 55 59 L 60 92 L 67 101 L 74 101 L 61 61 Z" fill="#1f110b"/>

        <!-- Cabeza girada hacia el frente con orejas grandes -->
        <!-- Orejas -->
        <polygon points="34,30 18,4 46,21" fill="#c86d25" stroke="#934710" stroke-width="1.4"/>
        <polygon points="35,26 24,9 43,20" fill="#f4a261"/>
        <polygon points="52,30 62,3 43,19" fill="#c86d25" stroke="#934710" stroke-width="1.4" opacity="0.9"/>

        <!-- Hocico y rostro -->
        <ellipse cx="37" cy="30" rx="16" ry="14" fill="#d97706" stroke="#934710" stroke-width="1.4"/>
        <path d="M 25 35 L 40 35 L 44 43 L 26 43 Z" fill="#1f110b"/> <!-- hocico fino -->
        <path d="M 30 36 L 36 36 L 36 40 L 30 40 Z" fill="#ffffff"/> <!-- barbilla blanca -->

        <!-- Ojos expresivos -->
        <g id="ojos">
          <circle cx="31" cy="28" r="3.5" fill="#e9c46a"/>
          <circle cx="31" cy="28" r="1.9" fill="#1f110b"/>
          <circle cx="30" cy="27" r="0.8" fill="#ffffff"/>
          <circle cx="42" cy="28" r="3.5" fill="#e9c46a"/>
          <circle cx="42" cy="28" r="1.9" fill="#1f110b"/>
          <circle cx="41" cy="27" r="0.8" fill="#ffffff"/>
        </g>

        <!-- Boca -->
        <path id="boca" d="M 33 43 Q 37 46 41 43" fill="none" stroke="#1f110b" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="shadow"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-comer" onclick="alimentar()">
      <span class="btn-icon">🥩</span>
      <span>Alimentar</span>
    </button>
    <button class="btn" id="btn-jugar" onclick="jugar()">
      <span class="btn-icon">🌿</span>
      <span>Jugar</span>
    </button>
  </div>

  <script>
    let hambre = parseInt(localStorage.getItem('guazu_v3_hambre')) || 100;
    let felicidad = parseInt(localStorage.getItem('guazu_v3_felicidad')) || 100;

    const fillHambre = document.getElementById('fill-hambre');
    const fillFelicidad = document.getElementById('fill-felicidad');
    const txtHambre = document.getElementById('txt-hambre');
    const txtFelicidad = document.getElementById('txt-felicidad');
    const ojos = document.getElementById('ojos');
    const boca = document.getElementById('boca');
    const bocadillo = document.getElementById('bocadillo');
    const guazuBox = document.getElementById('guazu-box');
    const stageArea = document.getElementById('stage-area');

    const frasesComer = [
      "🥩 ¡Ñam! Qué rica carne.",
      "🦴 ¡Muchas gracias por el banquete!",
      "🌿 ¡Me encanta este alimento!",
      "🐾 ¡Panza llena, corazón contento!"
    ];

    const frasesJugar = [
      "🌿 ¡Qué divertido correr por los esteros!",
      "🐾 ¡Aowu! Disfruto mucho pasear.",
      "✨ ¡Qué energía tan linda!",
      "🌾 ¡Explorando el monte!"
    ];

    const sabiduriaGuazu = [
      "💡 Dato real: El aguará guazú es el cánido más grande de Sudamérica y vive en pastizales y humedales.",
      "💡 Dato real: Sus patas largas y oscuras le permiten caminar con facilidad entre los pastos altos.",
      "💡 Dato real: Su distintiva melena oscura sobre el lomo se eriza cuando está alerta o excitado.",
      "💡 Dato real: Su dieta es omnívora: come pequeños animales, aves, insectos y también frutos silvestres.",
      "💡 Conservación: Es un animal inofensivo para los humanos y actualmente se encuentra protegido por estar amenazado.",
      "📜 Curiosidad: Su nombre en guaraní significa 'zorro grande'.",
      "📜 Curiosidad: Tienen hábitos preferentemente crepusculares y nocturnos.",
      "📜 Curiosidad: Sus grandes orejas le ayudan a detectar sonidos sutiles en medio de la llanura."
    ];

    function guardar() {
      localStorage.setItem('guazu_v3_hambre', hambre);
      localStorage.setItem('guazu_v3_felicidad', felicidad);
    }

    function mostrarTexto(msg) {
      bocadillo.innerText = msg;
    }

    function obtenerElementoAleatorio(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function actualizarInterfaz(mensajePersonalizado = null) {
      fillHambre.style.width = hambre + '%';
      fillFelicidad.style.width = felicidad + '%';
      txtHambre.innerText = hambre + '%';
      txtFelicidad.innerText = felicidad + '%';

      if (hambre <= 0 || felicidad <= 0) {
        ojos.innerHTML = `
          <path d="M 28 26 L 35 30" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
          <path d="M 28 30 L 35 26" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
          <path d="M 38 26 L 45 30" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
          <path d="M 38 30 L 45 26" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
        `;
        boca.setAttribute('d', 'M 33 44 Q 37 40 41 44');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre <= 0 && felicidad <= 0) {
          mostrarTexto("😿 ¡Tengo hambre y tristeza! Toca 'Alimentar' 🥩 y 'Jugar' 🌿");
        } else if (hambre <= 0) {
          mostrarTexto("😾 ¡Necesito energía! Toca el botón 'Alimentar' 🥩");
        } else {
          mostrarTexto("😿 Estoy triste... Presiona 'Jugar' 🌿");
        }
      } else if (hambre < 40 || felicidad < 40) {
        ojos.innerHTML = `
          <circle cx="31" cy="28" r="2.2" fill="#1f110b"/>
          <circle cx="42" cy="28" r="2.2" fill="#1f110b"/>
        `;
        boca.setAttribute('d', 'M 33 42 L 41 42');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre < 40 && felicidad < 40) {
          mostrarTexto("🙀 Toca 'Alimentar' 🥩 y 'Jugar' 🌿 para alegrarme.");
        } else if (hambre < 40) {
          mostrarTexto("😾 Tengo hambre... ¡Presiona 'Alimentar' 🥩!");
        } else {
          mostrarTexto("😿 Me estoy aburriendo... Presiona 'Jugar' 🌿.");
        }
      } else {
        ojos.innerHTML = `
          <circle cx="31" cy="28" r="3.5" fill="#e9c46a"/>
          <circle cx="31" cy="28" r="1.9" fill="#1f110b"/>
          <circle cx="30" cy="27" r="0.8" fill="#ffffff"/>
          <circle cx="42" cy="28" r="3.5" fill="#e9c46a"/>
          <circle cx="42" cy="28" r="1.9" fill="#1f110b"/>
          <circle cx="41" cy="27" r="0.8" fill="#ffffff"/>
        `;
        boca.setAttribute('d', 'M 33 43 Q 37 46 41 43');
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        }
      }
    }

    function triggerAnim(className) {
      guazuBox.classList.remove('happy-bounce', 'eat-wiggle', 'catch-ball');
      void guazuBox.offsetWidth;
      guazuBox.classList.add(className);
    }

    function spawnHeart(e) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerText = '💚';
      const rect = guazuBox.getBoundingClientRect();
      heart.style.left = (e.clientX || (rect.left + rect.width / 2)) + 'px';
      heart.style.top = (e.clientY || (rect.top + rect.height / 2)) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    }

    function alimentar() {
      hambre = Math.min(100, hambre + 25);
      if (felicidad < 20) felicidad = Math.min(100, felicidad + 10);
      guardar();

      const food = document.createElement('div');
      food.className = 'animated-item anim-fish';
      food.innerText = '🥩';
      stageArea.appendChild(food);

      boca.setAttribute('d', 'M 33 41 Q 37 48 41 41');

      setTimeout(() => {
        triggerAnim('eat-wiggle');
        food.remove();
        actualizarInterfaz(obtenerElementoAleatorio(frasesComer));
      }, 500);
    }

    function jugar() {
      felicidad = Math.min(100, felicidad + 25);
      hambre = Math.max(0, hambre - 5);
      guardar();

      const ball = document.createElement('div');
      ball.className = 'animated-item anim-ball';
      ball.innerText = '🌿';
      stageArea.appendChild(ball);

      setTimeout(() => {
        triggerAnim('catch-ball');
      }, 200);

      setTimeout(() => {
        ball.remove();
        actualizarInterfaz(obtenerElementoAleatorio(frasesJugar));
      }, 700);
    }

    function acariciar(e) {
      spawnHeart(e);
      triggerAnim('happy-bounce');
      if (hambre < 40 || felicidad < 40) {
        actualizarInterfaz();
      } else {
        actualizarInterfaz(obtenerElementoAleatorio(sabiduriaGuazu));
      }
    }

    setInterval(() => {
      if (hambre > 0 || felicidad > 0) {
        hambre = Math.max(0, hambre - 2);
        felicidad = Math.max(0, felicidad - 2);
        guardar();
        actualizarInterfaz();
      }
    }, 4000);

    window.addEventListener('load', () => {
      actualizarInterfaz();
    });
  </script>
</body>
</html>
