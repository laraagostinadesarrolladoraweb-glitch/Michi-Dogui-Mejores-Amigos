<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Michi & Dogui - Mejores Amigos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, #dbeafe 0%, #fef3c7 70%);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px max(20px, env(safe-area-inset-bottom));
      position: relative;
    }

    .scene-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px max(20px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .fondo-nube {
      position: absolute;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 50px;
      pointer-events: none;
      z-index: 1;
      animation: floatNube 10s ease-in-out infinite alternate;
    }

    @keyframes floatNube {
      0% { transform: translateX(-10px); }
      100% { transform: translateX(10px); }
    }

    .suelo-pasto {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 130px;
      background: linear-gradient(to top, #86efac 0%, #bbf7d0 70%, transparent 100%);
      border-radius: 50% 50% 0 0 / 25px 25px 0 0;
      pointer-events: none;
      z-index: 2;
    }

    .titulo-app {
      color: #b45309;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(255,255,255,0.9);
      z-index: 20;
      margin-top: 5px;
    }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .speech-bubble {
      background: #ffffff;
      color: #78350f;
      padding: 10px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 8px 20px rgba(180, 83, 9, 0.15);
      margin-bottom: 25px;
      position: relative;
      border: 2px solid #f59e0b;
      max-width: 95%;
      text-align: center;
      transition: all 0.3s ease;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    .duo-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-end;
      position: relative;
      margin-bottom: 5px;
    }

    .mascota-wrapper {
      width: 130px;
      height: 130px;
      cursor: pointer;
      position: relative;
      pointer-events: auto;
      filter: drop-shadow(0 12px 8px rgba(0,0,0,0.12));
      animation: respirar 3s ease-in-out infinite;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #michi-box { animation-delay: 0s; }
    #dogui-box { animation-delay: 1.5s; }

    @keyframes respirar {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-4px) scale(1.02, 0.98); }
    }

    /* Acciones dinámicas individuales */
    .mascota-wrapper.jump-action { animation: jumpVivo 0.6s ease; }
    .mascota-wrapper.spin-action { animation: spinVivo 0.7s ease; }
    .mascota-wrapper.dash-action { animation: dashVivo 0.6s ease; }

    @keyframes jumpVivo {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-45px) scale(1.05, 0.95) rotate(-3deg); }
      60% { transform: translateY(-45px) scale(0.95, 1.05) rotate(3deg); }
    }

    @keyframes spinVivo {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes dashVivo {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(20px) scale(1.08, 0.92); }
    }

    /* Estado de Abrazo: se acercan al centro */
    .duo-container.hugging #michi-box {
      transform: translateX(45px) scale(1.1) translateY(-10px);
    }

    .duo-container.hugging #dogui-box {
      transform: translateX(-45px) scale(1.1) translateY(-10px);
    }

    .shadow-container {
      display: flex;
      gap: 50px;
      justify-content: center;
    }

    .shadow {
      width: 80px;
      height: 12px;
      background: rgba(120, 53, 15, 0.22);
      border-radius: 50%;
      transition: transform 0.6s ease, width 0.6s ease;
      animation: sombraRespirar 3s ease-in-out infinite;
    }

    #shadow-2 { animation-delay: 1.5s; }

    @keyframes sombraRespirar {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.9); opacity: 0.5; }
    }

    .duo-container.hugging ~ .shadow-container #shadow-1 {
      transform: translateX(25px) scale(0.7);
    }

    .duo-container.hugging ~ .shadow-container #shadow-2 {
      transform: translateX(-25px) scale(0.7);
    }

    .controls {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(180, 83, 9, 0.15);
      border: 2px solid #f59e0b;
      z-index: 20;
      pointer-events: auto;
    }

    .btn {
      background: #fff3c4;
      color: #78350f;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 10px rgba(180, 83, 9, 0.1);
    }

    .btn:active {
      transform: scale(0.94);
      background: #fde68a;
    }

    .btn-icon { font-size: 16px; }

    .particle {
      position: absolute;
      pointer-events: none;
      animation: floatUpVivo 1s forwards ease-out;
      z-index: 30;
      font-size: 24px;
    }

    @keyframes floatUpVivo {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
    }
  </style>
</head>
<body>

  <div class="scene-container">
    <div class="fondo-nube" style="width: 100px; height: 35px; top: 15%; left: 8%;"></div>
    <div class="fondo-nube" style="width: 130px; height: 45px; top: 12%; right: 10%;"></div>
    <div class="suelo-pasto"></div>

    <div class="titulo-app">Michi & Dogui 🐾</div>

    <div class="stage">
      <div class="speech-bubble" id="bocadillo">¡Toca los botones o a nosotros para vernos cobrar vida! 🌟</div>
      
      <div class="duo-container" id="duoContainer">
        <!-- MICHI -->
        <div class="mascota-wrapper" id="michi-box" onclick="tocarMascota('michi')">
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <path d="M 75 75 Q 92 60 85 45" fill="none" stroke="#e67e22" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="28" cy="78" rx="7" ry="5" fill="#ffffff" stroke="#d35400" stroke-width="1"/>
            <ellipse cx="72" cy="78" rx="7" ry="5" fill="#ffffff" stroke="#d35400" stroke-width="1"/>
            <polygon points="22,40 12,18 36,28" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
            <polygon points="24,36 17,22 33,28" fill="#f2a685"/>
            <polygon points="78,40 88,18 64,28" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
            <polygon points="76,36 83,22 67,28" fill="#f2a685"/>
            <ellipse cx="50" cy="58" rx="32" ry="28" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
            <path d="M 50 42 C 40 46 38 62 38 72 C 44 80 56 80 62 72 C 62 62 60 46 50 42 Z" fill="#ffffff"/>
            <polygon points="48,59 52,59 50,62" fill="#e8a7a1"/>
            <circle cx="37" cy="53" r="5" fill="#5c3d2e"/>
            <circle cx="37" cy="53" r="3" fill="#1f110b"/>
            <circle cx="35.5" cy="51.5" r="1.2" fill="#ffffff"/>
            <circle cx="63" cy="53" r="5" fill="#5c3d2e"/>
            <circle cx="63" cy="53" r="3" fill="#1f110b"/>
            <circle cx="61.5" cy="51.5" r="1.2" fill="#ffffff"/>
            <path d="M 45 64 Q 50 67 55 64" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- DOGUI -->
        <div class="mascota-wrapper" id="dogui-box" onclick="tocarMascota('dogui')">
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <path d="M 28 42 C 18 50 22 72 30 70 C 35 68 35 55 33 45 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
            <path d="M 72 42 C 82 50 78 72 70 70 C 65 68 65 55 67 45 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
            <circle cx="50" cy="58" r="28" fill="#d97706" stroke="#78350f" stroke-width="2"/>
            <circle cx="50" cy="42" r="22" fill="#d97706" stroke="#78350f" stroke-width="2"/>
            <ellipse cx="50" cy="48" rx="11" ry="9" fill="#fefce8"/>
            <ellipse cx="50" cy="46" rx="4" ry="3" fill="#1f110b"/>
            <circle cx="39" cy="38" r="4" fill="#1f110b"/>
            <circle cx="37.8" cy="36.8" r="1.2" fill="#ffffff"/>
            <circle cx="61" cy="38" r="4" fill="#1f110b"/>
            <circle cx="59.8" cy="36.8" r="1.2" fill="#ffffff"/>
            <path d="M 45 53 Q 50 57 55 53" fill="none" stroke="#1f110b" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="shadow-container">
        <div class="shadow" id="shadow-1"></div>
        <div class="shadow" id="shadow-2"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="realizarAccion('saltar')">
        <span class="btn-icon">⚡</span>
        <span>Saltar</span>
      </button>
      <button class="btn" onclick="realizarAccion('girar')">
        <span class="btn-icon">🌀</span>
        <span>Girar</span>
      </button>
      <button class="btn" onclick="realizarAccion('carrera')">
        <span class="btn-icon">🏃‍♂️</span>
        <span>Carrera</span>
      </button>
      <button class="btn" onclick="realizarAccion('abrazar')">
        <span class="btn-icon">💖</span>
        <span>Abrazo</span>
      </button>
    </div>
  </div>

  <script>
    const bocadillo = document.getElementById('bocadillo');
    const michiBox = document.getElementById('michi-box');
    const doguiBox = document.getElementById('dogui-box');
    const duoContainer = document.getElementById('duoContainer');
    const shadow1 = document.getElementById('shadow-1');
    const shadow2 = document.getElementById('shadow-2');

    function mostrarTexto(msg) {
      bocadillo.innerText = msg;
    }

    function spawnParticle(symbol, el) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.innerText = symbol;
      const rect = el.getBoundingClientRect();
      p.style.left = (rect.left + rect.width / 2) + 'px';
      p.style.top = (rect.top + rect.height / 2) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }

    function limpiarAcciones() {
      michiBox.classList.remove('jump-action', 'spin-action', 'dash-action');
      doguiBox.classList.remove('jump-action', 'spin-action', 'dash-action');
      duoContainer.classList.remove('hugging');
    }

    function realizarAccion(tipo) {
      limpiarAcciones();

      if (tipo === 'saltar') {
        void michiBox.offsetWidth;
        michiBox.classList.add('jump-action');
        doguiBox.classList.add('jump-action');
        shadow1.style.transform = 'scale(0.5)';
        shadow2.style.transform = 'scale(0.5)';
        setTimeout(() => {
          shadow1.style.transform = 'scale(1)';
          shadow2.style.transform = 'scale(1)';
        }, 600);
        spawnParticle('✨', michiBox);
        spawnParticle('🚀', doguiBox);
        mostrarTexto("🚀 ¡Brincando de alegría por todo el jardín! 🌟");
      } else if (tipo === 'girar') {
        void michiBox.offsetWidth;
        michiBox.classList.add('spin-action');
        doguiBox.classList.add('spin-action');
        spawnParticle('💫', michiBox);
        spawnParticle('🌀', doguiBox);
        mostrarTexto("🌀 ¡Dando vueltas llenos de energía y diversión! 😸🐶");
      } else if (tipo === 'carrera') {
        void michiBox.offsetWidth;
        michiBox.classList.add('dash-action');
        doguiBox.classList.add('dash-action');
        spawnParticle('💨', michiBox);
        spawnParticle('⚡', doguiBox);
        mostrarTexto("🏃‍♂️ ¡Corriendo una carrerita muy animados! 🐾");
      } else if (tipo === 'abrazar') {
        // Se acercan al centro mutuamente
        duoContainer.classList.add('hugging');
        spawnParticle('💖', michiBox);
        spawnParticle('🥰', doguiBox);
        mostrarTexto("💖 ¡Se acercan y se dan un super abrazo de mejores amigos! 🥰");

        // Regresan a su sitio después de un momento
        setTimeout(() => {
          duoContainer.classList.remove('hugging');
        }, 1200);
      }
    }

    function tocarMascota(quien) {
      limpiarAcciones();
      void michiBox.offsetWidth;
      michiBox.classList.add('jump-action');
      doguiBox.classList.add('jump-action');
      
      if (quien === 'michi') {
        spawnParticle('✨', michiBox);
        mostrarTexto("🐱 ¡Michi ronronea feliz con tu caricia!");
      } else {
        spawnParticle('🐾', doguiBox);
        mostrarTexto("🐶 ¡Dogui mueve la cola muy emocionado!");
      }
    }
  </script>
</body>
</html>
