<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Michi & Dogui - Interactivo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, #dbeafe 0%, #fef3c7 70%);
      transition: background 1s ease;
    }

    body.noche {
      background: linear-gradient(to bottom, #1e1b4b 0%, #4c1d95 70%);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* Elementos del entorno */
    .sol-luna {
      position: absolute;
      top: 25px;
      right: 30px;
      width: 55px;
      height: 55px;
      background: #f59e0b;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 25px #fbbf24;
      transition: all 0.5s ease;
      z-index: 5;
    }

    body.noche .sol-luna {
      background: #e2e8f0;
      box-shadow: 0 0 20px #cbd5e1;
      border-radius: 50% 20% 50% 50%;
    }

    .fondo-nube {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      cursor: pointer;
      z-index: 3;
      transition: transform 0.3s ease;
    }

    .fondo-nube:hover { transform: scale(1.05); }

    .gota-lluvia {
      position: absolute;
      background: #38bdf8;
      width: 3px;
      height: 15px;
      border-radius: 50%;
      pointer-events: none;
      animation: caerLluvia 0.8s linear infinite;
      z-index: 4;
    }

    @keyframes caerLluvia {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(350px); opacity: 0; }
    }

    .suelo-pasto {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 140px;
      background: linear-gradient(to top, #86efac 0%, #bbf7d0 70%, transparent 100%);
      border-radius: 50% 50% 0 0 / 30px 30px 0 0;
      pointer-events: none;
      z-index: 2;
    }

    body.noche .suelo-pasto {
      background: linear-gradient(to top, #15803d 0%, #166534 70%, transparent 100%);
    }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .duo-container {
      display: flex;
      gap: 40px;
      justify-content: center;
      align-items: flex-end;
      position: relative;
      margin-bottom: 10px;
    }

    .mascota-wrapper {
      width: 130px;
      height: 130px;
      cursor: pointer;
      position: relative;
      pointer-events: auto;
      filter: drop-shadow(0 12px 8px rgba(0,0,0,0.12));
      animation: respirar 3s ease-in-out infinite;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #michi-box { animation-delay: 0s; }
    #dogui-box { animation-delay: 1.5s; }

    @keyframes respirar {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-4px) scale(1.02, 0.98); }
    }

    /* Acciones visuales */
    .mascota-wrapper.jump { animation: saltarVivo 0.5s ease; }
    .mascota-wrapper.spin { animation: girarVivo 0.6s ease; }
    .mascota-wrapper.shake { animation: mareoVivo 0.4s ease infinite; }

    @keyframes saltarVivo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-50px) scale(1.05, 0.95); }
    }

    @keyframes girarVivo {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes mareoVivo {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-8px) rotate(-8deg); }
      75% { transform: translateX(8px) rotate(8deg); }
    }

    .shadow-container {
      display: flex;
      gap: 70px;
      justify-content: center;
    }

    .shadow {
      width: 80px;
      height: 12px;
      background: rgba(120, 53, 15, 0.22);
      border-radius: 50%;
      animation: sombraRespirar 3s ease-in-out infinite;
    }

    #shadow-2 { animation-delay: 1.5s; }

    @keyframes sombraRespirar {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.85); opacity: 0.4; }
    }

    /* Juguetes interactivos flotantes abajo */
    .juguetes-bar {
      display: flex;
      gap: 25px;
      background: rgba(255, 255, 255, 0.8);
      padding: 12px 25px;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      z-index: 20;
      backdrop-filter: blur(5px);
      margin-bottom: 10px;
      border: 2px solid rgba(255,255,255,0.9);
    }

    .juguete {
      font-size: 30px;
      cursor: grab;
      transition: transform 0.2s ease;
      touch-action: none;
    }

    .juguete:active { cursor: grabbing; transform: scale(1.2); }

    .particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1s forwards ease-out;
      z-index: 30;
      font-size: 26px;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
    }
  </style>
</head>
<body>

  <!-- Entorno: Sol/Luna y Nubes -->
  <div class="sol-luna" onclick="cambiarClima()" title="Cambiar clima"></div>
  <div class="fondo-nube" style="width: 110px; height: 38px; top: 20%; left: 10%;" onclick="activarLluvia()" title="Hacer llover"></div>
  <div class="fondo-nube" style="width: 90px; height: 32px; top: 15%; right: 25%;" onclick="activarLluvia()" title="Hacer llover"></div>
  <div class="suelo-pasto"></div>

  <div class="stage">
    <div class="duo-container">
      <!-- MICHI -->
      <div class="mascota-wrapper" id="michi-box" onclick="tocarParte('michi', event)">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <path d="M 75 75 Q 92 60 85 45" fill="none" stroke="#e67e22" stroke-width="5" stroke-linecap="round"/>
          <ellipse cx="28" cy="78" rx="7" ry="5" fill="#ffffff" stroke="#d35400" stroke-width="1"/>
          <ellipse cx="72" cy="78" rx="7" ry="5" fill="#ffffff" stroke="#d35400" stroke-width="1"/>
          <polygon points="22,40 12,18 36,28" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
          <polygon points="24,36 17,22 33,28" fill="#f2a685"/>
          <polygon points="78,40 88,18 64,28" fill="#e67e22" stroke="#d35400" stroke-width="1.5"/>
          <polygon points="76,36 83,22 67,28" fill="#f2a685"/>
          <ellipse cx="50" cy="58" rx="32" ry="28" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
          <path d="M 50 42 C 40 46 38 62 38 72 C 44 80 56 80 62 72 C 62 62 60 46 50 42 Z" fill="#ffffff"/>
          <polygon points="48,59 52,59 50,62" fill="#e8a7a1"/>
          <circle cx="37" cy="53" r="5" fill="#5c3d2e"/>
          <circle cx="37" cy="53" r="3" fill="#1f110b"/>
          <circle cx="35.5" cy="51.5" r="1.2" fill="#ffffff"/>
          <circle cx="63" cy="53" r="5" fill="#5c3d2e"/>
          <circle cx="63" cy="53" r="3" fill="#1f110b"/>
          <circle cx="61.5" cy="51.5" r="1.2" fill="#ffffff"/>
          <path d="M 45 64 Q 50 67 55 64" fill="none" stroke="#2c3e50" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- DOGUI -->
      <div class="mascota-wrapper" id="dogui-box" onclick="tocarParte('dogui', event)">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <path d="M 28 42 C 18 50 22 72 30 70 C 35 68 35 55 33 45 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
          <path d="M 72 42 C 82 50 78 72 70 70 C 65 68 65 55 67 45 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
          <circle cx="50" cy="58" r="28" fill="#d97706" stroke="#78350f" stroke-width="2"/>
          <circle cx="50" cy="42" r="22" fill="#d97706" stroke="#78350f" stroke-width="2"/>
          <ellipse cx="50" cy="48" rx="11" ry="9" fill="#fefce8"/>
          <ellipse cx="50" cy="46" rx="4" ry="3" fill="#1f110b"/>
          <circle cx="39" cy="38" r="4" fill="#1f110b"/>
          <circle cx="37.8" cy="36.8" r="1.2" fill="#ffffff"/>
          <circle cx="61" cy="38" r="4" fill="#1f110b"/>
          <circle cx="59.8" cy="36.8" r="1.2" fill="#ffffff"/>
          <path d="M 45 53 Q 50 57 55 53" fill="none" stroke="#1f110b" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="shadow-container">
      <div class="shadow" id="shadow-1"></div>
      <div class="shadow" id="shadow-2"></div>
    </div>
  </div>

  <!-- Juguetes interactivos para arrastrar -->
  <div class="juguetes-bar">
    <div class="juguete" id="toy-ball" draggable="true">⚽</div>
    <div class="juguete" id="toy-food" draggable="true">🍖</div>
  </div>

  <script>
    const michiBox = document.getElementById('michi-box');
    const doguiBox = document.getElementById('dogui-box');
    const body = document.body;

    function spawnParticle(symbol, el) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.innerText = symbol;
      const rect = el.getBoundingClientRect();
      p.style.left = (rect.left + rect.width / 2) + 'px';
      p.style.top = (rect.top + rect.height / 2) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }

    function animarMascota(el, clase) {
      el.classList.remove('jump', 'spin');
      void el.offsetWidth;
      el.classList.add(clase);
      setTimeout(() => el.classList.remove(clase), 600);
    }

    // 1. Tocar por zonas de la mascota
    function tocarParte(quien, event) {
      const el = quien === 'michi' ? michiBox : doguiBox;
      const rect = el.getBoundingClientRect();
      const clickY = event.clientY - rect.top;

      if (clickY < rect.height * 0.4) {
        // Cabeza: Salto feliz y corazones
        animarMascota(el, 'jump');
        spawnParticle('💖', el);
      } else if (clickY > rect.height * 0.7) {
        // Colita: Giro divertido
        animarMascota(el, 'spin');
        spawnParticle('✨', el);
      } else {
        // Pancita: Risas / saltito doble
        animarMascota(el, 'jump');
        spawnParticle('😸', el);
      }
    }

    // 2. Entorno: Cambiar clima (Sol / Luna)
    function cambiarClima() {
      body.classList.toggle('noche');
      spawnParticle(body.classList.contains('noche') ? '🌙' : '☀️', document.querySelector('.sol-luna'));
    }

    // 3. Entorno: Hacer llover al tocar las nubes
    function activarLluvia() {
      for (let i = 0; i < 12; i++) {
        let gota = document.createElement('div');
        gota.className = 'gota-lluvia';
        gota.style.left = Math.random() * window.innerWidth + 'px';
        gota.style.top = (Math.random() * 80) + 'px';
        document.body.appendChild(gota);
        setTimeout(() => gota.remove(), 800);
      }
      spawnParticle('☔', michiBox);
    }

    // 4. Gestos: Mareo por movimiento rápido del mouse / pantalla
    let ultimoX = 0, ultimoY = 0, ultimoTiempo = Date.now();
    window.addEventListener('mousemove', (e) => {
      let ahora = Date.now();
      if (ahora - ultimoTiempo > 100) {
        let velocidad = Math.abs(e.clientX - ultimoX) + Math.abs(e.clientY - ultimoY);
        if (velocidad > 150) {
          michiBox.classList.add('shake');
          doguiBox.classList.add('shake');
          setTimeout(() => {
            michiBox.classList.remove('shake');
            doguiBox.classList.remove('shake');
          }, 800);
        }
        ultimoX = e.clientX;
        ultimoY = e.clientY;
        ultimoTiempo = ahora;
      }
    });

    // 5. Sistema de Arrastrar Juguetes (Drag & Drop táctil y mouse)
    const juguetes = document.querySelectorAll('.juguete');
    juguetes.forEach(juguete => {
      let posX = 0, posY = 0, initialX = 0, initialY = 0;

      juguete.addEventListener('pointerdown', dragStart);

      function dragStart(e) {
        initialX = e.clientX;
        initialY = e.clientY;
        juguete.style.position = 'relative';
        juguete.style.zIndex = '100';
        window.addEventListener('pointermove', drag);
        window.addEventListener('pointerup', dragEnd);
      }

      function drag(e) {
        posX = e.clientX - initialX;
        posY = e.clientY - initialY;
        juguete.style.transform = `translate(${posX}px, ${posY}px) scale(1.2)`;
      }

      function dragEnd(e) {
        window.removeEventListener('pointermove', drag);
        window.removeEventListener('pointerup', dragEnd);

        // Detectar si soltó sobre alguna mascota
        const rectMichi = michiBox.getBoundingClientRect();
        const rectDogui = doguiBox.getBoundingClientRect();

        if (e.clientX >= rectMichi.left && e.clientX <= rectMichi.right && e.clientY >= rectMichi.top && e.clientY <= rectMichi.bottom) {
          animarMascota(michiBox, 'jump');
          spawnParticle(juguete.innerText, michiBox);
        } else if (e.clientX >= rectDogui.left && e.clientX <= rectDogui.right && e.clientY >= rectDogui.top && e.clientY <= rectDogui.bottom) {
          animarMascota(doguiBox, 'jump');
          spawnParticle(juguete.innerText, doguiBox);
        }

        juguete.style.transform = 'translate(0px, 0px) scale(1)';
        juguete.style.zIndex = '20';
      }
    });
  </script>
</body>
</html>
