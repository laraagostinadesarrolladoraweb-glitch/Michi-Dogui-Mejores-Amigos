<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Guazú - Mi Mascota Virtual</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #fffbeb 0%, #fef3c7 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px max(20px, env(safe-area-inset-bottom));
      position: relative;
    }

    .bg-particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      animation: floatBg 8s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes floatBg {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-30px) scale(1.1); opacity: 0.9; }
    }

    .top-panel {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    .nombre-mascota {
      color: #b45309;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .barras-container {
      width: 100%;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .barra-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .barra-label {
      font-size: 11px;
      font-weight: 800;
      color: #78350f;
      display: flex;
      justify-content: space-between;
    }

    .progreso-track {
      background: #fde68a;
      height: 10px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progreso-fill {
      height: 100%;
      width: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    #fill-hambre { background: linear-gradient(90deg, #34d399, #10b981); }
    #fill-felicidad { background: linear-gradient(90deg, #f59e0b, #d97706); }

    .stage {
      flex: 1;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .speech-bubble {
      background: #ffffff;
      color: #78350f;
      padding: 10px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 6px 16px rgba(180, 83, 9, 0.1);
      margin-bottom: 12px;
      position: relative;
      border: 2px solid #f59e0b;
      max-width: 90%;
      text-align: center;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    .guazu-wrapper {
      width: 160px;
      height: 160px;
      cursor: pointer;
      position: relative;
      animation: floatIdle 3.5s infinite ease-in-out;
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .guazu-wrapper.happy-bounce { animation: bounce 0.6s ease; }
    .guazu-wrapper.eat-wiggle { animation: chew 0.8s ease; }
    .guazu-wrapper.catch-ball { animation: catchJump 0.8s ease; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.1, 0.9); }
    }

    @keyframes chew {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.08, 0.92); }
      60% { transform: scale(0.95, 1.05); }
    }

    @keyframes catchJump {
      0% { transform: translateY(0); }
      30% { transform: translateY(-25px) rotate(-8deg); }
      100% { transform: translateY(0); }
    }

    .animated-item {
      position: absolute;
      font-size: 28px;
      pointer-events: none;
      z-index: 15;
    }

    .anim-fish { animation: dropFood 0.6s forwards; }
    @keyframes dropFood {
      0% { transform: translateY(-80px) scale(1.2); opacity: 1; }
      100% { transform: translateY(10px) scale(0.4); opacity: 0; }
    }

    .anim-ball { animation: throwBall 0.8s forwards; }
    @keyframes throwBall {
      0% { transform: translate(-100px, 40px) scale(1); }
      50% { transform: translate(-20px, -30px) scale(1.2); }
      100% { transform: translate(0px, 10px) scale(0.2); opacity: 0; }
    }

    .shadow {
      width: 110px;
      height: 12px;
      background: rgba(180, 83, 9, 0.15);
      border-radius: 50%;
      margin-top: 6px;
    }

    .controls {
      width: 100%;
      max-width: 380px;
      display: flex;
      gap: 12px;
      background: #ffffff;
      padding: 8px;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(180, 83, 9, 0.15);
      border: 2px solid #f59e0b;
      z-index: 20;
    }

    .btn {
      flex: 1;
      background: #fff3c4;
      color: #78350f;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.95);
      background: #fde68a;
    }

    .btn-icon { font-size: 18px; }

    .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.2s forwards ease-out;
      z-index: 30;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }
  </style>
</head>
<body>

  <div class="bg-particle" style="width: 70px; height: 70px; top: 10%; left: 5%;"></div>
  <div class="bg-particle" style="width: 100px; height: 100px; top: 50%; right: 5%;"></div>

  <div class="top-panel">
    <div class="nombre-mascota">Guazú</div>

    <div class="barras-container">
      <div class="barra-item">
        <div class="barra-label"><span>Hambre</span><span id="txt-hambre">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-hambre"></div></div>
      </div>
      <div class="barra-item">
        <div class="barra-label"><span>Felicidad</span><span id="txt-felicidad">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-felicidad"></div></div>
      </div>
    </div>
  </div>

  <div class="stage" id="stage-area">
    <div class="speech-bubble" id="bocadillo">¡Aowu! Tócame para darme mimos o aprender sobre el monte 🐾</div>
    
    <div class="guazu-wrapper" id="guazu-box" onclick="acariciar(event)">
      <svg id="guazu-svg" viewBox="0 0 100 100" width="100%" height="100%">
        <!-- Orejas grandes características del aguará guazú -->
        <polygon points="30,35 15,5 42,24" fill="#c86d25" stroke="#934710" stroke-width="1.5"/>
        <polygon points="31,31 20,11 39,24" fill="#f4a261"/>
        <polygon points="70,35 85,5 58,24" fill="#c86d25" stroke="#934710" stroke-width="1.5"/>
        <polygon points="69,31 80,11 61,24" fill="#f4a261"/>

        <!-- Cabeza estirada y hocico fino -->
        <ellipse cx="50" cy="46" rx="26" ry="22" fill="#c86d25" stroke="#934710" stroke-width="1.5"/>
        <!-- Hocico alargado oscuro y barbilla blanca -->
        <path d="M 40 50 L 60 50 L 63 62 L 37 62 Z" fill="#d97706"/>
        <path d="M 47 52 L 53 52 L 54 58 L 46 58 Z" fill="#1f110b"/>
        <path d="M 40 62 C 45 67 55 67 60 62 C 55 68 45 68 40 62 Z" fill="#ffffff"/>

        <!-- Ojos expresivos -->
        <g id="ojos">
          <circle cx="38" cy="40" r="4.5" fill="#e9c46a"/>
          <circle cx="38" cy="40" r="2.5" fill="#1f110b"/>
          <circle cx="36.8" cy="39" r="1" fill="#ffffff"/>
          <circle cx="62" cy="40" r="4.5" fill="#e9c46a"/>
          <circle cx="62" cy="40" r="2.5" fill="#1f110b"/>
          <circle cx="60.8" cy="39" r="1" fill="#ffffff"/>
        </g>

        <!-- Boca -->
        <path id="boca" d="M 47 62 Q 50 65 53 62" fill="none" stroke="#1f110b" stroke-width="1.5" stroke-linecap="round"/>
        
        <!-- Cuerpo compacto sentado -->
        <ellipse cx="50" cy="74" rx="22" ry="18" fill="#c86d25" stroke="#934710" stroke-width="1.5"/>
        <ellipse cx="50" cy="76" rx="12" ry="12" fill="#ffffff"/>

        <!-- Patas delanteras largas -->
        <g id="patitas">
          <rect x="40" y="78" width="5" height="15" rx="2.5" fill="#1f110b"/>
          <rect x="55" y="78" width="5" height="15" rx="2.5" fill="#1f110b"/>
        </g>
      </svg>
    </div>

    <div class="shadow"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-comer" onclick="alimentar()">
      <span class="btn-icon">🥩</span>
      <span>Alimentar</span>
    </button>
    <button class="btn" id="btn-jugar" onclick="jugar()">
      <span class="btn-icon">🌿</span>
      <span>Jugar</span>
    </button>
  </div>

  <script>
    let hambre = parseInt(localStorage.getItem('guazu_v1_hambre')) || 100;
    let felicidad = parseInt(localStorage.getItem('guazu_v1_felicidad')) || 100;

    const fillHambre = document.getElementById('fill-hambre');
    const fillFelicidad = document.getElementById('fill-felicidad');
    const txtHambre = document.getElementById('txt-hambre');
    const txtFelicidad = document.getElementById('txt-felicidad');
    const ojos = document.getElementById('ojos');
    const boca = document.getElementById('boca');
    const bocadillo = document.getElementById('bocadillo');
    const guazuBox = document.getElementById('guazu-box');
    const stageArea = document.getElementById('stage-area');

    const frasesComer = [
      "🥩 ¡Ñam! Qué rica carne.",
      "🦴 ¡Muchas gracias por el banquete!",
      "🌿 ¡Me encanta este alimento!",
      "🐾 ¡Panza llena, corazón contento!"
    ];

    const frasesJugar = [
      "🌿 ¡Qué divertido correr por los esteros!",
      "🐾 ¡Aowu! Disfruto mucho pasear.",
      "✨ ¡Qué energía tan linda!",
      "🌾 ¡Explorando el monte!"
    ];

    const sabiduriaGuazu = [
      "💡 Dato real: El aguará guazú es el cánido más grande de Sudamérica y vive en pastizales y humedales.",
      "💡 Dato real: Sus patas largas y negras le permiten caminar con facilidad entre los pastos altos.",
      "💡 Dato real: A pesar de su apariencia similar a un zorro con patas de lobo, es una especie única y solitaria.",
      "💡 Dato real: Su dieta es omnívora: come pequeños animales, aves, insectos y también frutos silvestres.",
      "💡 Conservación: Es un animal inofensivo para los humanos y actualmente se encuentra protegido por estar amenazado.",
      "📜 Curiosidad: Su nombre en guaraní significa 'zorro grande'.",
      "📜 Curiosidad: Tienen hábitos preferentemente crepusculares y nocturnos.",
      "📜 Curiosidad: Sus grandes orejas le ayudan a detectar sonidos sutiles en medio de la llanura."
    ];

    function guardar() {
      localStorage.setItem('guazu_v1_hambre', hambre);
      localStorage.setItem('guazu_v1_felicidad', felicidad);
    }

    function mostrarTexto(msg) {
      bocadillo.innerText = msg;
    }

    function obtenerElementoAleatorio(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function actualizarInterfaz(mensajePersonalizado = null) {
      fillHambre.style.width = hambre + '%';
      fillFelicidad.style.width = felicidad + '%';
      txtHambre.innerText = hambre + '%';
      txtFelicidad.innerText = felicidad + '%';

      if (hambre <= 0 || felicidad <= 0) {
        ojos.innerHTML = `
          <path d="M 34 38 L 42 42" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
          <path d="M 34 42 L 42 38" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
          <path d="M 58 38 L 66 42" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
          <path d="M 58 42 L 66 38" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
        `;
        boca.setAttribute('d', 'M 47 64 Q 50 60 53 64');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre <= 0 && felicidad <= 0) {
          mostrarTexto("😿 ¡Tengo hambre y tristeza! Toca 'Alimentar' 🥩 y 'Jugar' 🌿");
        } else if (hambre <= 0) {
          mostrarTexto("😾 ¡Necesito energía! Toca el botón 'Alimentar' 🥩");
        } else {
          mostrarTexto("😿 Estoy triste... Presiona 'Jugar' 🌿");
        }
      } else if (hambre < 40 || felicidad < 40) {
        ojos.innerHTML = `
          <circle cx="38" cy="40" r="3" fill="#1f110b"/>
          <circle cx="62" cy="40" r="3" fill="#1f110b"/>
        `;
        boca.setAttribute('d', 'M 47 63 L 53 63');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre < 40 && felicidad < 40) {
          mostrarTexto("🙀 Toca 'Alimentar' 🥩 y 'Jugar' 🌿 para alegrarme.");
        } else if (hambre < 40) {
          mostrarTexto("😾 Tengo hambre... ¡Presiona 'Alimentar' 🥩!");
        } else {
          mostrarTexto("😿 Me estoy aburriendo... Presiona 'Jugar' 🌿.");
        }
      } else {
        ojos.innerHTML = `
          <circle cx="38" cy="40" r="4.5" fill="#e9c46a"/>
          <circle cx="38" cy="40" r="2.5" fill="#1f110b"/>
          <circle cx="36.8" cy="39" r="1" fill="#ffffff"/>
          <circle cx="62" cy="40" r="4.5" fill="#e9c46a"/>
          <circle cx="62" cy="40" r="2.5" fill="#1f110b"/>
          <circle cx="60.8" cy="39" r="1" fill="#ffffff"/>
        `;
        boca.setAttribute('d', 'M 47 62 Q 50 65 53 62');
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        }
      }
    }

    function triggerAnim(className) {
      guazuBox.classList.remove('happy-bounce', 'eat-wiggle', 'catch-ball');
      void guazuBox.offsetWidth;
      guazuBox.classList.add(className);
    }

    function spawnHeart(e) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerText = '💚';
      const rect = guazuBox.getBoundingClientRect();
      heart.style.left = (e.clientX || (rect.left + rect.width / 2)) + 'px';
      heart.style.top = (e.clientY || (rect.top + rect.height / 2)) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    }

    function alimentar() {
      hambre = Math.min(100, hambre + 25);
      if (felicidad < 20) felicidad = Math.min(100, felicidad + 10);
      guardar();

      const food = document.createElement('div');
      food.className = 'animated-item anim-fish';
      food.innerText = '🥩';
      stageArea.appendChild(food);

      boca.setAttribute('d', 'M 46 61 Q 50 68 54 61');

      setTimeout(() => {
        triggerAnim('eat-wiggle');
        food.remove();
        actualizarInterfaz(obtenerElementoAleatorio(frasesComer));
      }, 500);
    }

    function jugar() {
      felicidad = Math.min(100, felicidad + 25);
      hambre = Math.max(0, hambre - 5);
      guardar();

      const ball = document.createElement('div');
      ball.className = 'animated-item anim-ball';
      ball.innerText = '🌿';
      stageArea.appendChild(ball);

      setTimeout(() => {
        triggerAnim('catch-ball');
      }, 200);

      setTimeout(() => {
        ball.remove();
        actualizarInterfaz(obtenerElementoAleatorio(frasesJugar));
      }, 700);
    }

    function acariciar(e) {
      spawnHeart(e);
      triggerAnim('happy-bounce');
      if (hambre < 40 || felicidad < 40) {
        actualizarInterfaz();
      } else {
        actualizarInterfaz(obtenerElementoAleatorio(sabiduriaGuazu));
      }
    }

    setInterval(() => {
      if (hambre > 0 || felicidad > 0) {
        hambre = Math.max(0, hambre - 2);
        felicidad = Math.max(0, felicidad - 2);
        guardar();
        actualizarInterfaz();
      }
    }, 4000);

    window.addEventListener('load', () => {
      actualizarInterfaz();
    });
  </script>
</body>
</html>
